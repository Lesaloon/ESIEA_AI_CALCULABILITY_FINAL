server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/environment/ {
        resolver 127.0.0.11 valid=10s;
        set $environment_upstream environment:8000;
        rewrite ^/api/environment/(.*)$ /$1 break;
        proxy_pass http://$environment_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
